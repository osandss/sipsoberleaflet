  <style>

    .leaflet-container { position: relative; }

    .leaflet-tile-pane {
      filter: brightness(0.92) contrast(1.05);
    }
    
    .leaflet-container::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    
      background: linear-gradient(
        to bottom,
        rgba(27,30,49,0.10) 0%,
        rgba(27,30,49,0.05) 40%,
        rgba(27,30,49,0.02) 100%
      );
    
      z-index: 200;
    }
    
    .leaflet-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(0,0,0,0) 0%,
          rgba(27,30,49,0.08) 55%,
          rgba(27,30,49,0.18) 100%
        );
    
      z-index: 300;
    }

    #map::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 140px;
      pointer-events: none;
    
      background: linear-gradient(
        to bottom,
        rgba(27,30,49,0.18) 0%,
        rgba(27,30,49,0.10) 40%,
        rgba(27,30,49,0.00) 100%
      );

    .dropdown > button {
      background: transparent;
      border: none;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      color: rgba(255,255,255,0.92);
    }

    .dropdown .menu {
      max-height: 160px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

      background: rgba(255,255,255,0.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 7px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }

    /* ═══════════════════════════════════════════════
       FIX 1: #map uses position:fixed (not absolute).
       This is the #1 cause of the grey-tile flash and
       the layout jump — absolute sizing races against
       iOS's async layout pipeline.
       ─────────────────────────────────────────────── */
    #map {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;

      /* Warm fallback so blank area is never cold grey */
      background: #f0ede8;

      /* Promote to GPU compositor layer before tiles arrive */
      will-change: transform;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    body.map-loading #map {
      opacity: 0;
    }

    body.map-ready #map {
      opacity: 1;
      transition: opacity 0.18s ease;
    }
    
    @supports (height: 100dvh) { #map { height: 100dvh; } }

    /* Match #map fallback — no grey flash between map div and tiles */
    .leaflet-container { background: #f0ede8; }

    .dropdown { position: relative; }

    .dropdown .menu {
      display: none;
      position: absolute;
      top: 120%;
      left: 0;
      background: #ffffff;
      border: 1px solid #e2e4ec;
      border-radius: 16px;
      padding: 10px 12px;
      width: 200px;
      z-index: 3000;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
    }

    .dropdown.open .menu { display: block; }

    .dropdown .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      margin: 0;
      font-size: 12px;
      color: #1c1c1e;
    }

    #bottom-panel {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 0;
      height: var(--panel-collapsed);
    
      background: rgba(29, 33, 52, 0.96);
	  backdrop-filter: blur(24px) saturate(1.15);
	  -webkit-backdrop-filter: blur(24px) saturate(1.15);
    
      border-radius: 28px 28px 0 0;
	  box-shadow:
	    0 -14px 40px rgba(8, 10, 20, 0.25),
	    0 -1px 0 rgba(255,255,255,0.06);
    
      display: flex;
	  flex-direction: column;
	  padding: 9px 14px calc(10px + env(safe-area-inset-bottom));
	  z-index: 2001;
	  overflow: hidden;
	  transform: translateY(2px);
		
      transition:
	    height 220ms cubic-bezier(0.22, 1, 0.36, 1),
	    background 180ms ease,
	    transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #bottom-panel::before {
	  content: "";
	  position: absolute;
	  top: 0;
	  left: 18px;
	  right: 18px;
	  height: 1px;
	  background: linear-gradient(
	    to right,
	    transparent,
	    rgba(255,255,255,0.14),
	    transparent
	  );
	  opacity: 0.4;
	  pointer-events: none;
	}
    
    #bottom-panel.selected {
	  height: var(--panel-selected);
	  transform: translateY(0);
	}
	
	#bottom-panel.expanded {
	  height: var(--panel-expanded);
	  background: rgba(29, 33, 52, 0.98);
	  transform: translateY(0);
	}

    #panel-header {
	  flex: 0 0 auto;
	  padding: 0 8px 6px;
	}
	
	#panel-body {
	  flex: 1 1 auto;
	  overflow-y: auto;
	  -webkit-overflow-scrolling: auto;
	  padding: 8px 6px 16px;
	
	  /* Prevent scroll position shifting */
	  overflow-anchor: none;
	}
	
	#results,
	.card {
	  overflow-anchor: none;
	}
	
	#bottom-panel.selected #panel-body {
	  overflow-y: auto;
	  -webkit-overflow-scrolling: touch;
	  padding: 0 6px 8px;
	  flex: 1 1 auto;
	  min-height: 0;
	}

	/* Tighter spacing when viewing an expanded selected venue */
	#bottom-panel.expanded:has(.card.is-selected) #panel-body {
	  padding-top: 0;
	}

	/* Subtle divider below selected venue */
	#bottom-panel.selected .card.is-selected {
	  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
	  padding-bottom: 12px;
	}
    
    #bottom-panel.expanded #panel-body {
	  overflow-y: auto;
	}
	
	#results {
	  padding: 0;
	}

    #panel-meta-row {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  gap: 8px;
	  margin-top: 0;

    body.ss-embed #filters { display: none !important; }

    /* Bookmark — minimal, no circle */

	.fav-btn {

    .card {
	  position: relative;
	  isolation: isolate;
	  background: transparent;
	  border-radius: 0;
	  border: 0;
	  border-bottom: 1px solid rgba(255,255,255,0.16);
	  padding: 12px 8px;

	  color: rgba(255,255,255,0.96);
	  line-height: 1.3;
	  box-shadow: none;

	  transition:
	    transform .34s cubic-bezier(.22,1,.36,1),
	    box-shadow .34s cubic-bezier(.22,1,.36,1),
	    border-color .34s cubic-bezier(.22,1,.36,1),
	    background .34s cubic-bezier(.22,1,.36,1),
	    opacity .25s ease;
	}
	
	.card::before {

/* ─────────────────────────────────────────────────────────────────
   FIX 2: Map initialises AFTER the browser has completed its first
   paint. This guarantees Leaflet reads the true #map dimensions,
   which eliminates both the grey-tile gap and the layout jump.
   ───────────────────────────────────────────────────────────────── */
function _initMap(){
  map = L.map("map",{
    zoomControl: false,
    scrollWheelZoom: true,
    preferCanvas: true,
    // FIX 3: tap:false stops Leaflet's iOS tap shim from triggering
    // an unwanted invalidateSize() that causes the visible jump.
    tap: false
  }).setView([40.790,-73.985],12.1);

  const baseTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png?key=cb1_32mn_1_c50a8550ac3189af34a5b1e6", {
    maxZoom: 20,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    updateWhenIdle: true,
    keepBuffer: 6,
    detectRetina: false,
    updateWhenZooming: false
  });
  
  map.createPane("labelPane");
  map.getPane("labelPane").style.zIndex = 300;
  map.getPane("labelPane").style.pointerEvents = "none";
  map.getPane("labelPane").style.opacity = "0.52";
  
  map.getPane("markerPane").style.zIndex = 500;
  
  const labelTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png?key=cb1_32mn_1_c50a8550ac3189af34a5b1e6", {
    maxZoom: 17,
    subdomains: "abcd",
    pane: "labelPane",
    updateWhenIdle: true,
    keepBuffer: 6,
    detectRetina: false,
    updateWhenZooming: false
  });
  
  baseTiles.addTo(map);
  labelTiles.addTo(map);
  
  baseTiles.once("load", () => {
    document.body.classList.remove("map-loading");
    document.body.classList.add("map-ready");
    if (map) {
      map.invalidateSize({ animate: false, pan: false });
    }
  });

  map.setMaxBounds(manhattanLockBounds);
  map.options.maxBoundsViscosity = 0.1;
  map.setMinZoom(11.5);
  markersLayer = L.layerGroup().addTo(map);

  /* ─── FIX 5: Clean, two-step invalidateSize sequence ────────────
     • rAF frame 1 → layout is done
     • rAF frame 2 → paint is done → NOW call invalidateSize
     • 300 ms later → catch any WKWebView async settle
  ────────────────────────────────────────────────────────────── */
  function kickSize() {
    if (!map) return;
    requestAnimationFrame(() => {
      map.invalidateSize({ animate: false, pan: false });
    });
  }

  map.whenReady(() => {
    kickSize();
    setTimeout(() => {
      if (map) map.invalidateSize({ animate: false, pan: false });
    }, 150);
  });

  window.addEventListener("resize", kickSize);
  window.addEventListener("orientationchange", () => {
    setTimeout(kickSize, 150);
  });

  map.on("click", () => {
    clearVenueSelection({ preserveMapView: true });
  });

  map.on("zoomend", () => {
	updateVenueNameLabels();
  });

  _buildIcons();
  applyIconForViewport();
  mobileQuery.addEventListener("change", applyIconForViewport);

  _mapReady = true;
  if(_pendingUserLocation){
    window.SipSober.setUserLocation(_pendingUserLocation.lat,_pendingUserLocation.lng);
    _pendingUserLocation = null;
  }

  applyFiltersUnified();
  window.SipSober?.sendVenuesToNative?.();
  kickSize();
}

/* ─── ICONS ────────────────────────────────────────────────────── */
function makePinIconSVG(hex="#2D334D", size=[28,38], opts={}){
  const [w,h] = size;
  const ring = opts.ring ?? false;
  const innerDot = opts.innerDot ?? "#F7F8FB";

  return `
  <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 28 38">
    ${ring ? `
      <path
        d="M14 0C6.82 0 1 5.82 1 13c0 9.75 11.4 23.4 12.01 24.13a1.25 1.25 0 0 0 1.98 0C15.6 36.4 27 22.75 27 13 27 5.82 21.18 0 14 0z"
        fill="none"
        stroke="rgba(32,34,57,0.24)"
        stroke-width="1.6"
      />
    ` : ""}

    <path
      d="M14 0C6.82 0 1 5.82 1 13c0 9.75 11.4 23.4 12.01 24.13a1.25 1.25 0 0 0 1.98 0C15.6 36.4 27 22.75 27 13 27 5.82 21.18 0 14 0z"
      fill="${hex}" opacity="0.92"
      stroke="rgba(255,255,255,0.05)"
      stroke-width="0.45"
    />

    <circle cx="14" cy="13" r="3.9" fill="${innerDot}" />
  </svg>`;
}

function makeIcon(size=[28,38], color="#2D334D", isActive=false){
  return L.icon({
    iconUrl: "data:image/svg+xml;utf8," + encodeURIComponent(
      makePinIconSVG(color, size, {
        ring: isActive,
        innerDot: "#F7F8FB"
      })
    ),
    iconSize: size,
    iconAnchor: [Math.floor(size[0] / 2), size[1]],
    popupAnchor: [0, -Math.floor(size[1] * 0.84)]
  });
}

function _buildIcons(){
  const isMobile = mobileQuery.matches;

  const size = isMobile ? [12,18] : [18,26];
  const activeSize = isMobile ? [17,25] : [28,40];

  defaultIcon = makeIcon(size, "#465071", false);
  activeIcon = makeIcon(activeSize, "#2D334D", true);

  currentIcon = defaultIcon;
  L.Marker.prototype.options.icon = currentIcon;
}

const __origMarkerFactory = L.marker;
L.marker = function(latlng,options){
  const opts=options||{};
  if(!opts.icon) opts.icon=currentIcon||makeIcon();
  return __origMarkerFactory.call(this,latlng,opts);
};

function setActiveMarker(m){
  if(_activeMarker&&_activeMarker!==m) _activeMarker.setIcon(defaultIcon);
  _activeMarker=m||null;
  if(_activeMarker) _activeMarker.setIcon(activeIcon);
}

function clearActiveMarker(){
  if(_activeMarker) _activeMarker.setIcon(defaultIcon);
  _activeMarker=null;
}

function applyIconForViewport(){
  if(!map) return;
  _buildIcons();
  if(markersLayer&&markersLayer.eachLayer){
    markersLayer.eachLayer(layer=>{
      if(!layer||typeof layer.setIcon!=="function") return;
      layer.setIcon(layer===_activeMarker?activeIcon:defaultIcon);
    });
  }
}

function normalizeUrl(u){
  u=String(u||"").trim();
  if(!u||u.toLowerCase()==="n/a") return "";
  if(!/^https?:\/\//i.test(u)) u="https://"+u;
  return u;
}

function getSelectedValues(prefix){

function matchesSearch(loc,q){
  if(!q) return true;
  return [loc.name,loc.address,loc.brand,loc.neighborhood].filter(Boolean).join(" ").toLowerCase().includes(q.toLowerCase());
}

function normalizeDrinkType(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/s$/, "");
}

function getDrinkIcon(){
  return `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

  `;
}

function venueHasDrinkType(loc, drinkType){
  if(!drinkType) return true;

  const target = normalizeDrinkType(drinkType);

  const types = Array.isArray(loc.drinkTypes)
    ? loc.drinkTypes
    : [];

  return types.some(type => normalizeDrinkType(type) === target);
}

/* ─── FILTER CHIPS ─────────────────────────────────────────────── */
function updateActiveFilters(selectedBrands, selectedNeighborhoods){
  const c = document.getElementById("active-filters");
  if(!c) return;

  c.innerHTML = "";

  const has = selectedBrands.length || selectedNeighborhoods.length;

  // Hide filter pills while a selected venue card is open
  const hideWhileSelected = _selectedVenueId && !_panelUserExpanded;

  if(!has || hideWhileSelected){
    c.style.display = "none";
    return;
  }

  c.style.display = "flex";

  function pill(type, value){
    const p = document.createElement("span");
    p.className = "filter-pill";

    const x = document.createElement("span");
    x.className = "filter-pill-x";
    x.textContent = "×";

    const l = document.createElement("span");
    l.textContent = value;

    x.addEventListener("click", () => clearSingleFilter(type, value));

    p.appendChild(x);
    p.appendChild(l);
    c.appendChild(p);
  }

  selectedNeighborhoods.forEach(n => pill("neighborhood", n));
  selectedBrands.forEach(b => pill("brand", b));
}

function clearSingleFilter(type, value) {
  if (type === "brand") {
    document.querySelectorAll('input[id^="brand-"]').forEach(cb => {
      if (cb.value === value) cb.checked = false;
    });
  } else {
    document.querySelectorAll('input[id^="n-"]').forEach(cb => {
      if (cb.value === value) cb.checked = false;
    });
  }

  // Notify the native iOS app so its filter sheet stays in sync
  window.webkit?.messageHandlers?.filters?.postMessage({
    action: "remove",
    type,
    value
  });

  applyFiltersUnified();
}

let _didSendVenuesToNative=false;
function _brandsArrayFromString(s){return String(s||"").split(",").map(x=>x.trim()).filter(Boolean);}
function _venueForNative(loc){return{id:String(loc.id||""),name:String(loc.name||""),address:String(loc.address||""),neighborhood:String(loc.neighborhood||""),brands:_brandsArrayFromString(loc.brand),website:normalizeUrl(loc.website||""),lat:Number(loc.lat||0),lng:Number(loc.lng||0),imageUrl:String(loc.imageUrl||"")};}

window.SipSober.sendVenuesToNative=function(arg){
  try{
    const force=(typeof arg==="boolean")?arg:false;
    const source=Array.isArray(arg)?arg:(locations||[]);
    if(_didSendVenuesToNative&&!force&&!Array.isArray(arg)) return;
    const venues=source.map(_venueForNative).filter(v=>v.id&&v.name);
    if(window.webkit?.messageHandlers?.sipSober){
      window.webkit.messageHandlers.sipSober.postMessage({type:"venues",venues});
      _didSendVenuesToNative=true;
    }
  }catch(e){}
};

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function shortNote(text){
  if(!text) return "";

  let cleaned = String(text)
    .replace(/^Go for\s+/i, "")
    .replace(/^Try\s+/i, "")
    .replace(/^Try the\s+/i, "")
    .replace(/^Great for\s+/i, "")
    .replace(/^Known for\s+/i, "")
    .replace(/^Best for\s+/i, "")
    .replace(/^Refined seasonal drinks[—-]\s*/i, "")
    .replace(/^Modern cocktails[—-]\s*/i, "")
    .replace(/^Creative cocktails[—-]\s*/i, "")
    .replace(/^Tropical mocktails[—-]\s*/i, "")
    .replace(/\.$/, "")
    .trim();

  if (!cleaned) return "";

  if (cleaned.length > 58) {
    const cut = cleaned.slice(0, 58);
    cleaned = cut.slice(0, cut.lastIndexOf(" ")) || cut;
  }

  return cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
}

function setPanelState(state) {

function selectVenue(loc, opts = {}){
  if(!loc || !map) return;

  const {
    centerMap = true,
    zoom = 15,
    animate = true
  } = opts;

  const panel = document.getElementById("bottom-panel");
  const panelBody = document.getElementById("panel-body");

  const wasExpanded = _panelState === "expanded";

  _selectedVenueId = String(loc.id || "");
  _lastFocusedVenueId = _selectedVenueId;
  _panelUserExpanded = false;

  _preserveMapViewOnSelect = true;

  if(centerMap){
    const targetZoom = Math.max(map.getZoom(), zoom);

    map.invalidateSize(false);
    map.setView(
      [loc.lat, loc.lng],
      targetZoom,
      { animate }
    );
  }

  /*
   * When coming from Show All, keep this true until the
   * panel's height transition has completely finished.
   */
  _isCollapsingToSelected = wasExpanded;

  /*
   * Stop any remaining iOS momentum scrolling while the
   * panel is shrinking. Otherwise the list can bounce.
   */
  if(wasExpanded && panelBody){
    panelBody.style.overflowY = "hidden";
    panelBody.style.webkitOverflowScrolling = "auto";
  }

  let collapseFinished = false;
  let collapseFallback = null;

  const finishCollapse = () => {
    if(collapseFinished) return;
    collapseFinished = true;

    if(panel){
      panel.removeEventListener(
        "transitionend",
        handleTransitionEnd
      );
    }

    if(collapseFallback){
      clearTimeout(collapseFallback);
    }

    /*
     * Wait two paint frames so WebKit has applied the final
     * 30vh panel height before measuring and centering.
     */
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        _isCollapsingToSelected = false;

        syncSelectedListRow({
          behavior: "auto"
        });

        /*
         * Re-enable scrolling only after the selected card
         * has been positioned.
         */
        if(panelBody){
          panelBody.style.overflowY = "auto";
          panelBody.style.webkitOverflowScrolling = "touch";
        }
      });
    });
  };

  const handleTransitionEnd = (event) => {
    if(event.target !== panel) return;
    if(event.propertyName !== "height") return;

    finishCollapse();
  };

  /*
   * Attach the listener BEFORE changing the panel state.
   */
  if(wasExpanded && panel){
    panel.addEventListener(
      "transitionend",
      handleTransitionEnd
    );

    /*
     * Safety fallback for WebKit in case transitionend
     * does not fire. The CSS transition lasts 220ms.
     */
    collapseFallback = setTimeout(
      finishCollapse,
      280
    );
  }

  setPanelState("selected");

  refreshSelectionUI();

  _preserveMapViewOnSelect = false;

  const marker = markersById[_selectedVenueId];

  if(marker){
    setActiveMarker(marker);
  }

  showSelectedPinLabel(loc);
  updateVenueNameLabels();
	
  /*
   * If the panel was already short, there is no height
   * transition to wait for.
   */
  if(!wasExpanded){
    _isCollapsingToSelected = false;

    requestAnimationFrame(() => {
      syncSelectedListRow({
        behavior: "auto"
      });
    });

    return;
  }

  /*
   * For the expanded case, finishCollapse() will perform
   * the one and only centering operation after shrinking.
   */
}

	
function syncSelectedListRow(opts = {}){
  const {
    behavior = "smooth"
  } = opts;

  const results = document.getElementById("results");
  const panelBody = document.getElementById("panel-body");

  if(!results || !panelBody) return;

  // Remove old selected styling
  results.querySelectorAll(".card").forEach(card => {
    card.classList.remove("is-selected");
  });

  if(!_selectedVenueId) return;

  const escapedId =
    window.CSS && CSS.escape
      ? CSS.escape(_selectedVenueId)
      : _selectedVenueId;

  const selected = results.querySelector(
    `.card[data-venue-id="${escapedId}"]`
  );

  if(!selected) return;

  // Selected styling can always be applied immediately.
  selected.classList.add("is-selected");

  // Only center in selected mode.
  if(_panelState !== "selected") return;

  // CRITICAL:
  // If Show All is currently collapsing from 55vh → 30vh,
  // do NOT calculate a scroll position yet.
  if(_isCollapsingToSelected) return;

  // Always start at the top of the selected venue.
  // Users can scroll down to see THE SPOT and other details.
  panelBody.scrollTop = 0;
}

function refreshSelectionUI() {
  const results = document.getElementById("results");
  const rc = document.getElementById("results-count");

  if (!results) return;

  results.querySelectorAll(".card").forEach(card => {
    const venueId = String(card.dataset.venueId || "");
    const selected =
      venueId === String(_selectedVenueId || "");

    card.classList.toggle("is-selected", selected);

    /*
     * In selected mode, keep all cards in the DOM but
     * visually show only the selected card.
     */
    card.style.display =
      (_selectedVenueId &&
       !_panelUserExpanded &&
       !selected)
        ? "none"
        : "";

    /*
     * Add or remove the Directions button without
     * rebuilding the entire card.
     */
    let actionRow =
      card.querySelector(".card-badge-row--selected");

    let directionsButton =
      actionRow?.querySelector(".route-pill");

    if (selected) {
      const loc = getLocationById(venueId);

      if (loc) {
        const directionsUrl =
          `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(
            (loc.name || "") + " " + (loc.address || "")
          )}`;

        /*
         * Some cards may not already have a badge row.
         * Create one when needed.
         */
        if (!actionRow) {
          actionRow = document.createElement("div");
          actionRow.className =
            "card-badge-row card-badge-row--selected";

          card
            .querySelector(".card-content")
            ?.appendChild(actionRow);
        }

        if (!directionsButton) {
          directionsButton = document.createElement("a");
          directionsButton.className =
            "card-selected-pill primary card-selected-pill--inline route-pill";

          directionsButton.target = "_blank";
          directionsButton.rel = "noopener";

          directionsButton.innerHTML = `
            <span class="route-pill-icon">↗</span>
            Directions
          `;

          actionRow?.appendChild(directionsButton);
        }

        directionsButton.href = directionsUrl;
      }
    } else if (directionsButton) {
      directionsButton.remove();

      /*
       * Remove the row if Directions was its only content.
       */
      if (
        actionRow &&
        !actionRow.querySelector(".drink-pill")
      ) {
        actionRow.remove();
      }
    }
  });

  /*
   * Hide the result count while one venue is selected.
   */
  if (rc && _selectedVenueId && !_panelUserExpanded) {
    rc.textContent = "";
  }

  /*
   * Hide or restore filter pills based on selection state.
   */
  updateActiveFilters(
    getSelectedValues("brand"),
    getSelectedValues("n")
  );

  syncSelectedListRow({
    behavior: "auto"
  });
}

function clearVenueSelection(opts = {}) {
  _selectedVenueId = null;

  _panelUserExpanded = false;
  _isCollapsingToSelected = false;

  clearActiveMarker();

/* ─── RENDERERS ────────────────────────────────────────────────── */
function renderMarkers(data) {
  if (!markersLayer) {
    return {
      count: 0,
      bounds: null
    };
  }

  markersLayer.clearLayers();
  clearActiveMarker();
  clearSelectedPinLabel();
  clearVenueNameLabels();

  markersById = {};

  const bounds = L.latLngBounds([]);

  data.forEach(loc => {
    const marker = L.marker([
      loc.lat,
      loc.lng
    ]).addTo(markersLayer);

    marker.on("click", event => {
      if (event.originalEvent) {
        L.DomEvent.stopPropagation(
          event.originalEvent
        );
      }

      selectVenue(loc, {
        centerMap: true,
        zoom: 15,
        animate: true
      });
    });

    if (loc.id) {
	  markersById[String(loc.id)] = marker;
	
	  createVenueNameLabel(loc);
	}
	
	bounds.extend([
	  loc.lat,
	  loc.lng
	]);
  });

  /*
   * Restore selection after a legitimate filter render.
   */
  if (_selectedVenueId) {
    const selectedMarker =
      markersById[String(_selectedVenueId)];

    const selectedLocation =
      getLocationById(_selectedVenueId);

    if (selectedMarker) {
      setActiveMarker(selectedMarker);

      if (selectedLocation) {
        showSelectedPinLabel(selectedLocation);
      }
    }
  }

  updateVenueNameLabels();
	
  return {
    count: data.length,
    bounds: data.length ? bounds : null
  };
}

/* ─── FILTER + APPLY ────────────────────────────────────────────── */
function applyFiltersUnified(opts = {}){
  const { preserveMapView = false } = opts;
  
  closeAllMenus();
  const brands=getSelectedValues("brand"), hoods=getSelectedValues("n");
  const q=(document.getElementById("searchTopInput")?.value||"").trim();
  let filtered = locations.filter(loc => {
    // GUIDE MODE WINS:
    // If Xcode sends guide venue IDs, show exactly those venues.
    if (_activeGuideVenueIds.length) {
      return _activeGuideVenueIds.includes(String(loc.id));
    }
  
    const brandOK = brands.length
      ? brands.some(b => (loc.brand || "").toLowerCase().includes(b.toLowerCase()))
      : true;
  
    const hoodOK = hoods.length
      ? hoods.includes(loc.neighborhood)
      : true;
  
    const drinkOK = venueHasDrinkType(loc, _activeDrinkType);
  
    return brandOK && hoodOK && drinkOK && matchesSearch(loc, q);
  });
  
  const hasLoc=!!_userLocationForDistance;
  if(hasLoc){
    filtered.sort((a,b)=>{
      const da=_distanceMilesForVenue(a),db=_distanceMilesForVenue(b);
      if(da==null&&db==null) return (a.name||"").localeCompare(b.name||"",undefined,{sensitivity:"base"});
      if(da==null) return 1; if(db==null) return -1;
      if(da!==db) return da-db;
      return (a.name||"").localeCompare(b.name||"",undefined,{sensitivity:"base"});
    });
  } else {
    filtered.sort((a,b)=>(a.name||"").localeCompare(b.name||"",undefined,{sensitivity:"base"}));
  }

  renderList(filtered);
	
  if(!map) return;
  const{count,bounds}=renderMarkers(filtered);
  updateActiveFilters(brands,hoods);
  const panel=document.getElementById("bottom-panel");
  const panelH=panel?panel.getBoundingClientRect().height:0;
  
  const isDefaultView =
    !brands.length &&
    !hoods.length &&
    !q.length &&
    !_activeDrinkType &&
    !_activeGuideVenueIds.length &&
    !hasLoc;

  if (!preserveMapView && !_suppressAutoFit && !_preserveMapViewOnSelect) {
    if (isDefaultView) {
      fitInitialView();
    } else if (count > 0 && bounds) {
      map.fitBounds(bounds, {
        paddingTopLeft: [16, window.SipSober?.isEmbed ? 80 : 120],
        paddingBottomRight: [16, panelH + 40],
        maxZoom: 15,
        animate: false
      });
    }
  }

  if (_selectedVenueId) {
    const stillVisible = filtered.some(v => String(v.id) === String(_selectedVenueId));
    if (!stillVisible) {
      clearVenueSelection();
    }
  }
  
  window.filteredBounds=bounds;
}

function applyFiltersWithUserLocation(){applyFiltersUnified();}
function applyFilters(){applyFiltersUnified();}

/* ─── LOCATION BRIDGE ───────────────────────────────────────────── */
function _showUserLocation(lat,lng){
  if(!map) return;
  const ll=L.latLng(lat,lng);
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
  _userHalo=L.circle(ll,{radius:120,stroke:false,fill:true,fillOpacity:0.12}).addTo(map);
  _userDot=L.circleMarker(ll,{radius:6,stroke:true,weight:2,opacity:1,fill:true,fillOpacity:1}).addTo(map);
}

function _clearUserLocationLayers(){
  if(_userDot){try{map.removeLayer(_userDot);}catch(e){}_userDot=null;}
  if(_userHalo){try{map.removeLayer(_userHalo);}catch(e){}_userHalo=null;}
}

function _haversineMiles(lat1,lon1,lat2,lon2){
  const r=v=>(v*Math.PI)/180, R=3958.7613;
  const dLat=r(lat2-lat1),dLon=r(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function _distanceMilesForVenue(loc){
  if(!_userLocationForDistance) return null;
  const lat=Number(loc?.lat),lng=Number(loc?.lng);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)) return null;
  const m=_haversineMiles(_userLocationForDistance.lat,_userLocationForDistance.lng,lat,lng);
  return Number.isFinite(m)?m:null;
}

function _distanceLabelForVenue(loc){
  if(!_userLocationForDistance) return "";
  const m=_distanceMilesForVenue(loc);
  if(m==null) return "";
  return m<0.1?"<0.1 mi":`${m.toFixed(1)} mi`;
}

window.SipSober.setUserLocation=function(lat,lng){
  const LAT=Number(lat),LNG=Number(lng);
  if(!Number.isFinite(LAT)||!Number.isFinite(LNG)) return;
  if(!_mapReady){_pendingUserLocation={lat:LAT,lng:LNG};return;}
  _pendingUserLocation=null;
  _showUserLocation(LAT,LNG);
  _userLocationForDistance={lat:LAT,lng:LNG};
  _panelUserExpanded = true;
  setPanelState("expanded");
  applyFiltersUnified({ preserveMapView: true });
  map.invalidateSize(false);
  map.setView([LAT,LNG], Math.max(map.getZoom(),15), { animate:true });
};

window.SipSober.clearUserLocation=function(){
  _pendingUserLocation=null; _userLocationForDistance=null;
  applyFiltersUnified();
  if(!_mapReady) return;
  _clearUserLocationLayers();
};

window.SipSober.resetMapToDefault=function(){resetMapToDefault();};
window.setUserLocation  =function(lat,lng){window.SipSober.setUserLocation(lat,lng);};
window.clearUserLocation=function(){window.SipSober.clearUserLocation();};
window.resetMapToDefault=function(){window.SipSober.resetMapToDefault();};

/* ─── RESET ─────────────────────────────────────────────────────── */
function fitInitialView(){
  if(!map) return;

  const panel = document.getElementById("bottom-panel");
  const panelH = panel ? panel.getBoundingClientRect().height : 0;

  const defaultBounds = L.latLngBounds(
    [40.695, -74.035],
    [40.825, -73.925]
  );

  map.fitBounds(defaultBounds, {
    paddingTopLeft: [16, window.SipSober?.isEmbed ? 75 : 115],
    paddingBottomRight: [16, panelH + 30],
    animate: false
  });
}

function resetMapToDefault(){
  closeAllMenus();
  document.getElementById("searchTopRow")?.classList.remove("is-open");
  document.getElementById("searchToggle")?.setAttribute("aria-expanded","false");

  document.querySelectorAll('input[id^="brand-"],input[id^="n-"]').forEach(cb => {
    cb.checked = false;
  });

  const si = document.getElementById("searchTopInput");
  if (si) si.value = "";

  _suppressAutoFit = true;
  _activeDrinkType = "";
  _activeGuideVenueIds = [];
  _panelUserExpanded = false;
  setPanelState("collapsed");

  // Clear all selected venue UI/state first
  clearVenueSelection();

  // Clear user location directly here (do NOT call window.SipSober.clearUserLocation)
  _pendingUserLocation = null;
  _userLocationForDistance = null;
  if (_mapReady) _clearUserLocationLayers();

  // Render once from a clean state
  applyFiltersUnified();
  updateActiveFilters([], []);

  if (map) {
    map.invalidateSize({ animate: false, pan: false });
    fitInitialView();
  }

  // Final cleanup after render
  requestAnimationFrame(() => {
    clearVenueSelection();
  });

  _suppressAutoFit = false;
}

/* ─── FAVORITES + FOCUS ─────────────────────────────────────────── */
window.SipSober.setFavorites=function(payload){
  const ids=new Set((payload&&payload.ids)||[]);
  document.querySelectorAll(".fav-btn[data-id]").forEach(btn=>btn.classList.toggle("is-fav",ids.has(btn.dataset.id)));
};

window.SipSober.setFilters=function(payload){
  const brands=Array.isArray(payload?.brands)?payload.brands:[];
  const hoods=Array.isArray(payload?.neighborhoods)?payload.neighborhoods:[];
  document.querySelectorAll('input[id^="brand-"]').forEach(cb=>{cb.checked=brands.includes(cb.value);});
  document.querySelectorAll('input[id^="n-"]').forEach(cb=>{cb.checked=hoods.includes(cb.value);});
  applyFiltersUnified();
};

window.SipSober.setDiscoverMode = function(payload){
  const ids = Array.isArray(payload?.guideVenueIds)
    ? payload.guideVenueIds.map(String).filter(Boolean)
    : [];

  const drinkType = String(payload?.drinkType || "").trim();

  _activeGuideVenueIds = ids;
  _activeDrinkType = ids.length ? "" : drinkType;

  document.querySelectorAll('input[id^="brand-"], input[id^="n-"]').forEach(cb => {
    cb.checked = false;
  });

  const si = document.getElementById("searchTopInput");
  if (si) si.value = "";

  _selectedVenueId = null;
  _lastFocusedVenueId = null;
  clearActiveMarker();
  clearSelectedPinLabel();

  const isGuideMode = _activeGuideVenueIds.length > 0;
  const isDrinkMode = !!_activeDrinkType;
	
  if (isDrinkMode) {
	  _panelUserExpanded = false;
	  setPanelState("collapsed");
	} else if (isGuideMode) {
	  _panelUserExpanded = true;
	  setPanelState("expanded");
	} else {
	  _panelUserExpanded = false;
	  setPanelState("collapsed");
	}

	applyFiltersUnified();
};

window.SipSober.setGuideVenueIds = function(payload){
  const ids = Array.isArray(payload)
    ? payload
    : Array.isArray(payload?.ids)
      ? payload.ids
      : [];

  _activeGuideVenueIds = ids.map(String).filter(Boolean);

  // Guide mode clears drink mode
  _activeDrinkType = "";

  // Clear visible web filters/search so old filters do not interfere
  document.querySelectorAll('input[id^="brand-"], input[id^="n-"]').forEach(cb => {
    cb.checked = false;
  });

  const si = document.getElementById("searchTopInput");
  if (si) si.value = "";

  _selectedVenueId = null;
  _lastFocusedVenueId = null;
  clearActiveMarker();
  clearSelectedPinLabel();

  _panelUserExpanded = true;
  setPanelState(_activeGuideVenueIds.length ? "expanded" : "collapsed");

  applyFiltersUnified();
};
  
window.SipSober.setDrinkType = function(drinkType){
  const nextDrinkType = String(drinkType || "").trim();

  _activeDrinkType = nextDrinkType;

  // Drink mode and guide mode cannot both be active
  if (nextDrinkType) {
    _activeGuideVenueIds = [];
  }

  _selectedVenueId = null;
  _lastFocusedVenueId = null;
  clearActiveMarker();
  clearSelectedPinLabel();

  _panelUserExpanded = !!nextDrinkType;
  setPanelState(nextDrinkType ? "expanded" : "collapsed");

  applyFiltersUnified();
};

window.SipSober.clearDrinkType=function(){
  _activeDrinkType = "";
  applyFiltersUnified();
};

window.SipSober.focusVenue=function(payload){
  const id = String((typeof payload==="string" ? payload : payload?.venueId) || "").trim();
  if(!id) return;

  const loc = getLocationById(id);
  if(!loc) return;

  _selectedVenueId = id;
  _lastFocusedVenueId = id;

  const marker = markersById?.[id];
  if(marker){
    selectVenue(loc, { centerMap:true, zoom:15, animate:true });
    return;
  }

  // 👇 THIS IS THE KEY CHANGE
  // Reset to full dataset so we can ALWAYS find the venue
  renderList(locations.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"", undefined, { sensitivity:"base" })));
  const { bounds } = renderMarkers(locations);
  updateActiveFilters(getSelectedValues("brand"), getSelectedValues("n"));
  window.filteredBounds = bounds;

  let tries = 0;
  (function attempt(){
    const marker = markersById?.[id];
    if(!marker){
      if(++tries <= 25) return setTimeout(attempt, 120);
      clearVenueSelection();
      return;
    }
    selectVenue(loc, { centerMap:true, zoom:15, animate:true });
  })();
};

window.SipSober.focusVenueById=function(id){window.SipSober.focusVenue(id);};
window.SipSober.closePopup=function(){try{map?.closePopup();}catch(e){}};

/* ─── EVENT WIRING ──────────────────────────────────────────────── */
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAllMenus();});

document.addEventListener("click",e=>{
  if(e.target.closest("a")){closeAllMenus();document.getElementById("searchTopRow")?.classList.remove("is-open");document.getElementById("searchToggle")?.setAttribute("aria-expanded","false");return;}
  const favBtn=e.target.closest(".fav-btn");
  if(favBtn){
    e.preventDefault();e.stopPropagation();
    const venueId=favBtn.dataset.id;
    const v=locations.find(x=>String(x.id)===String(venueId)); if(!v) return;
    favBtn.classList.toggle("is-fav");
	window.webkit?.messageHandlers?.favorites?.postMessage({
	    action: "toggle",
	    venue: {
	        venueId: String(v.id),
	        name: v.name || "",
	        address: v.address || "",
	        website: normalizeUrl(v.website || ""),
	        neighborhood: v.neighborhood || "",
	        brands: v.brand || "",
	        imageUrl: v.imageUrl || ""
	    }
	});    
	return;
  }
  const nameEl=e.target.closest(".card-name[data-focus-id]");
  if(nameEl){e.preventDefault();e.stopPropagation();window.SipSober?.focusVenue(nameEl.dataset.focusId);return;}
  const btn=e.target.closest(".dropdown > button");
  if(btn){const p=btn.parentElement,willOpen=!p.classList.contains("open");closeAllMenus();if(willOpen){p.classList.add("open");btn.setAttribute("aria-expanded","true");}return;}
  if(!e.target.closest(".dropdown")) closeAllMenus();
  if(!e.target.closest("#searchTopRow")&&!e.target.closest("#searchToggle")){
    const row=document.getElementById("searchTopRow");
    if(row?.classList.contains("is-open")){row.classList.remove("is-open");document.getElementById("searchToggle")?.setAttribute("aria-expanded","false");document.getElementById("searchTopInput")?.blur();}
  }
});

(() => {
  const panel = document.getElementById("bottom-panel");
  const toggle = document.getElementById("panel-toggle");

  if (!panel || !toggle) return;

  const DRAG_THRESHOLD = 35;
  const DRAG_START_THRESHOLD = 6;

  let tracking = false;
  let dragging = false;
  let startY = 0;
  let startX = 0;
  let startHeight = 0;
  let currentHeight = 0;
  let activePointerId = null;
  let suppressClick = false;

  function panelHeightFor(state) {
    const css = getComputedStyle(document.documentElement);

    const variable = state === "expanded"
      ? "--panel-expanded"
      : state === "selected"
        ? "--panel-selected"
        : "--panel-collapsed";

    const value = css.getPropertyValue(variable).trim();

    if (value.endsWith("vh")) {
      return window.innerHeight * parseFloat(value) / 100;
    }

    if (value.endsWith("px")) {
      return parseFloat(value);
    }

    return panel.getBoundingClientRect().height;
  }

  function resetDragStyles() {
    panel.style.removeProperty("height");
    panel.style.removeProperty("transition");
    toggle.style.removeProperty("cursor");
  }

  // MARK: - Existing panel behavior
  function expandPanel() {
    // Keep the selected venue when expanding.
    // Only show the full venue list if nothing is selected.
    _panelUserExpanded = !_selectedVenueId;

    setPanelState("expanded");
    refreshSelectionUI();

    requestAnimationFrame(() => {
	  requestAnimationFrame(() => {
	    const panelBody = document.getElementById("panel-body");

	    if (panelBody) {
		  panelBody.scrollTop = _selectedVenueId
		    ? 0
		    : _expandedScrollTop;
	    }
	  });
    });
  }

  function collapsePanel() {

    _panelUserExpanded = false;

    const nextState = _selectedVenueId
      ? "selected"
      : "collapsed";

    setPanelState(nextState);
    refreshSelectionUI();

    if (nextState === "selected") {
      requestAnimationFrame(() => {
        syncSelectedListRow({ behavior: "auto" });
      });
    }
  }

  function togglePanel() {
    if (_panelState === "expanded") {
      collapsePanel();
    } else {
      expandPanel();
    }
  }

  // MARK: - Tap to toggle
  toggle.addEventListener("click", (event) => {
    event.stopPropagation();

    if (suppressClick) {
      suppressClick = false;
      return;
    }

    togglePanel();
  });

  // MARK: - Begin drag
  toggle.addEventListener("pointerdown", (event) => {
    if (event.button !== undefined && event.button !== 0) return;
    if (tracking) return;

    tracking = true;
    dragging = false;

    activePointerId = event.pointerId;
    startY = event.clientY;
    startX = event.clientX;

    startHeight = panel.getBoundingClientRect().height;
    currentHeight = startHeight;

    toggle.setPointerCapture?.(event.pointerId);
  });

  // MARK: - Follow finger
  toggle.addEventListener("pointermove", (event) => {
    if (!tracking || event.pointerId !== activePointerId) return;

    const deltaY = event.clientY - startY;
    const deltaX = event.clientX - startX;

    if (!dragging) {
      if (
        Math.abs(deltaY) < DRAG_START_THRESHOLD ||
        Math.abs(deltaY) <= Math.abs(deltaX)
      ) {
        return;
      }

      dragging = true;

      panel.style.transition = "none";
      toggle.style.cursor = "grabbing";
    }

    const minHeight = panelHeightFor(
      _panelState === "selected" ? "selected" : "collapsed"
    );
    const maxHeight = panelHeightFor("expanded");

    currentHeight = Math.max(
      minHeight,
      Math.min(maxHeight, startHeight - deltaY)
    );

    panel.style.height = `${currentHeight}px`;
	
	// Reveal selected venue details while dragging upward
	if (_selectedVenueId) {
	  const revealHeight = minHeight + 45;
	
	  panel.classList.toggle(
	    "drag-reveal",
	    currentHeight >= revealHeight
	  );
	}
  });

  // MARK: - Release and snap
  toggle.addEventListener("pointerup", (event) => {
    if (!tracking || event.pointerId !== activePointerId) return;

    tracking = false;
    activePointerId = null;

    if (!dragging) return;

    dragging = false;
    suppressClick = true;

    const deltaY = event.clientY - startY;
    const expandedHeight = panelHeightFor("expanded");
    const lowerHeight = panelHeightFor(
      _panelState === "selected" ? "selected" : "collapsed"
    );

    const midpoint = (expandedHeight + lowerHeight) / 2;

    let shouldExpand;

    if (Math.abs(deltaY) >= DRAG_THRESHOLD) {
      shouldExpand = deltaY < 0;
    } else {
      shouldExpand = currentHeight >= midpoint;
    }

    // Restore the CSS transition while preserving the
    // current dragged height as the animation's starting point.
    panel.style.removeProperty("transition");
    void panel.offsetHeight;

    if (shouldExpand && _panelState !== "expanded") {
      expandPanel();
    } else if (!shouldExpand && _panelState === "expanded") {
      collapsePanel();
    }

    // Animate from the dragged height to the CSS state height.
    panel.style.removeProperty("height");
	toggle.style.removeProperty("cursor");
	panel.classList.remove("drag-reveal");
  });

  // MARK: - Cancel drag
  toggle.addEventListener("pointercancel", () => {
	if (!tracking) return;
	
	tracking = false;
	dragging = false;
	activePointerId = null;
	
	panel.classList.remove("drag-reveal");
	resetDragStyles();
  });

})();
